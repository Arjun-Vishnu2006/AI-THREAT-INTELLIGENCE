[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-analysis-foundation"
version = "0.1.0"
description = "API and data foundation for a multi-input threat investigation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "networkx>=3.4,<4.0",
  "scikit-learn>=1.5,<2.0",
  "numpy>=1.26,<3",
  "joblib>=1.4,<2.0",
  "lightgbm>=4.0,<5.0",
  "psycopg[binary]>=3.2,<4.0",
  "androguard>=4.1.4,<5.0",
  "pandas>=2.2,<4.0",
  "tqdm>=4.66,<5.0",
  "lief==1.0.0",
  "ember @ git+https://github.com/elastic/ember.git@d97a0b523de02f3fe5ea6089d080abacab6ee931",
]

[project.optional-dependencies]
qr = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "Pillow>=10,<13"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
